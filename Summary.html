<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>综合总览</title>
  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico">
  <style>
    :root{--bg:#07111f;--panel:#0f1a2a;--line:rgba(148,184,218,.16);--muted:#7a8ea1;--text:#e0e6ed;--accent:#4dd7d0;--toolbar:58px;--air:#ff6b7a;--rail:#4dd7d0;--city:#5b78f5;--trail:#ffc66d}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit}
    .topbar{height:var(--toolbar);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(7,17,31,.97);gap:14px;position:relative;z-index:1000}
    .brand{display:flex;align-items:center;gap:10px;min-width:200px}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#4dd7d0,#65a9ff);font-size:16px}.brand strong{font-size:18px;font-weight:700}.brand small{color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-left:6px}
    .toolbar{display:flex;align-items:center;gap:7px;flex:1}.tool-btn{height:34px;padding:0 12px;border:1px solid var(--line);background:#121f33;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;transition:.18s;text-decoration:none;color:var(--text)}.tool-btn:hover{border-color:rgba(77,215,208,.4);background:#162a42}.toolbar-spacer{flex:1}
    .page-tabs{display:flex;padding:3px;gap:3px;border:1px solid var(--line);border-radius:10px;background:#0d1a2e}.page-tab{height:28px;padding:0 11px;display:flex;align-items:center;gap:6px;border-radius:7px;color:#7a8ea1;text-decoration:none;font-size:11px;font-weight:700}.page-tab:hover{color:var(--text);background:#162a42}.page-tab.active{color:#07111f;background:linear-gradient(135deg,#a8f3ec,#64d7cf)}
    .main{height:calc(100% - var(--toolbar));overflow-y:auto;padding:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:.2s}
    .card:hover{border-color:rgba(77,215,208,.3);box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .card-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:18px}
    .card-icon.air{background:rgba(255,107,122,.15);color:var(--air)}
    .card-icon.rail{background:rgba(77,215,208,.15);color:var(--rail)}
    .card-icon.city{background:rgba(91,120,245,.15);color:var(--city)}
    .card-icon.trail{background:rgba(255,198,109,.15);color:var(--trail)}
    .card-icon.full{background:rgba(139,163,255,.12);color:#8ba3ff}
    .card-title{font-size:14px;font-weight:600}
    .card-subtitle{font-size:10px;color:var(--muted);margin-top:2px}
    .stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
    .stat-row:last-child{border-bottom:0}
    .stat-label{font-size:11px;color:var(--muted)}
    .stat-value{font-size:13px;font-weight:600}
    .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}
    .section-title{font-size:16px;font-weight:700;margin:24px 0 16px;display:flex;align-items:center;gap:8px}
    .section-title::before{content:"";width:3px;height:16px;background:var(--accent);border-radius:2px}
    @media(max-width:760px){.brand small,.brand-copy{display:none}.toolbar .tool-btn span{display:none}.tool-btn{padding:0 9px}.main{padding:12px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">📊</span><span class="brand-copy"><strong>综合总览</strong><small>Summary</small></span></div>
    <nav class="toolbar">
      <div class="page-tabs">
        <a class="page-tab" href="index.html">首页</a>
        <a class="page-tab" href="TravelAtlas.html">行程</a>
        <a class="page-tab" href="TravelAtlasCity.html">城市</a>
        <a class="page-tab" href="Trail.html">足迹</a>
        <a class="page-tab active" href="Summary.html">总览</a>
      </div>
      <button class="tool-btn" id="refreshBtn"><i>🔄</i><span>刷新</span></button>
      <div class="toolbar-spacer"></div>
    </nav>
  </header>
  <div class="main">
    <div class="section-title">行程数据</div>
    <div class="grid" id="tripGrid"></div>

    <div class="section-title">城市探索</div>
    <div class="grid" id="cityGrid"></div>

    <div class="section-title">足迹轨迹</div>
    <div class="grid" id="trailGrid"></div>

    <div class="section-title">快速链接</div>
    <div class="grid">
      <a class="card" href="TravelAtlas.html" style="text-decoration:none">
        <div class="card-header">
          <div class="card-icon air">️</div>
          <div>
            <div class="card-title">行程管理</div>
            <div class="card-subtitle">添加和管理航线/铁路</div>
          </div>
        </div>
      </a>
      <a class="card" href="TravelAtlasCity.html" style="text-decoration:none">
        <div class="card-header">
          <div class="card-icon city">🏙️</div>
          <div>
            <div class="card-title">城市探索</div>
            <div class="card-subtitle">标记到访城市</div>
          </div>
        </div>
      </a>
      <a class="card" href="Trail.html" style="text-decoration:none">
        <div class="card-header">
          <div class="card-icon trail">👣</div>
          <div>
            <div class="card-title">足迹轨迹</div>
            <div class="card-subtitle">查看 GPS 轨迹</div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <script>
  (() => {
    'use strict';
    const $ = s => document.querySelector(s);

    function loadTripData() {
      try {
        const data = localStorage.getItem('travelAtlasRows');
        return data ? JSON.parse(data) : [];
      } catch (e) { return [] }
    }

    function loadCityData() {
      try {
        const data = localStorage.getItem('travel-atlas-city-exploration-v1');
        return data ? JSON.parse(data) : {};
      } catch (e) { return {} }
    }

    function loadTrailData() {
      try {
        const data = localStorage.getItem('trailData');
        return data ? JSON.parse(data) : [];
      } catch (e) { return [] }
    }

    function renderTripStats(rows) {
      const grid = $('#tripGrid');
      if (!rows.length) {
        grid.innerHTML = '<div class="card"><div class="empty">暂无行程数据</div></div>';
        return;
      }
      const air = rows.filter(r => r.mode === 'air').length;
      const train = rows.filter(r => r.mode === 'train').length;
      const total = rows.length;
      const dates = rows.map(r => r.date).filter(Boolean);
      const dateRange = dates.length ? `${dates[0]} ~ ${dates[dates.length - 1]}` : '—';

      grid.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-icon full">📈</div>
            <div>
              <div class="card-title">总览</div>
              <div class="card-subtitle">行程统计</div>
            </div>
          </div>
          <div class="stat-row"><span class="stat-label">总行程</span><span class="stat-value">${total} 条</span></div>
          <div class="stat-row"><span class="stat-label">航空</span><span class="stat-value" style="color:var(--air)">${air} 条</span></div>
          <div class="stat-row"><span class="stat-label">铁路</span><span class="stat-value" style="color:var(--rail)">${train} 条</span></div>
          <div class="stat-row"><span class="stat-label">时间范围</span><span class="stat-value" style="font-size:11px">${dateRange}</span></div>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-icon air">✈️</div>
            <div>
              <div class="card-title">最近航空</div>
              <div class="card-subtitle">最新 5 条航班</div>
            </div>
          </div>
          ${rows.filter(r => r.mode === 'air').slice(-5).reverse().map(r => `
            <div class="stat-row">
              <span class="stat-label">${r.date || '—'} ${r.service || ''}</span>
              <span class="stat-value" style="font-size:11px">${r.origin || '?'} → ${r.destination || '?'}</span>
            </div>
          `).join('') || '<div class="empty">暂无航空数据</div>'}
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-icon rail">🚆</div>
            <div>
              <div class="card-title">最近铁路</div>
              <div class="card-subtitle">最新 5 条火车</div>
            </div>
          </div>
          ${rows.filter(r => r.mode === 'train').slice(-5).reverse().map(r => `
            <div class="stat-row">
              <span class="stat-label">${r.date || '—'} ${r.service || ''}</span>
              <span class="stat-value" style="font-size:11px">${r.origin || '?'} → ${r.destination || '?'}</span>
            </div>
          `).join('') || '<div class="empty">暂无铁路数据</div>'}
        </div>
      `;
    }

    function renderCityStats(levels) {
      const grid = $('#cityGrid');
      const codes = Object.keys(levels);
      if (!codes.length) {
        grid.innerHTML = '<div class="card"><div class="empty">暂无城市探索数据</div></div>';
        return;
      }
      const explored = codes.filter(c => levels[c] > 0).length;
      const maxLevel = Math.max(...Object.values(levels));
      const levelCounts = [0, 0, 0, 0, 0, 0];
      codes.forEach(c => { if (levels[c] >= 0 && levels[c] <= 5) levelCounts[levels[c]]++ });
      const levelNames = ['未到访', '途经', '停留', '游览', '住宿', '居住'];

      grid.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-icon city">🏙️</div>
            <div>
              <div class="card-title">城市探索</div>
              <div class="card-subtitle">探索等级统计</div>
            </div>
          </div>
          <div class="stat-row"><span class="stat-label">总城市</span><span class="stat-value">${codes.length} 个</span></div>
          <div class="stat-row"><span class="stat-label">已探索</span><span class="stat-value" style="color:var(--city)">${explored} 个</span></div>
          <div class="stat-row"><span class="stat-label">最高等级</span><span class="stat-value">${maxLevel} · ${levelNames[maxLevel]}</span></div>
          <div class="stat-row"><span class="stat-label">探索率</span><span class="stat-value">${(explored / codes.length * 100).toFixed(1)}%</span></div>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-icon full">📊</div>
            <div>
              <div class="card-title">等级分布</div>
              <div class="card-subtitle">各等级城市数量</div>
            </div>
          </div>
          ${levelCounts.map((count, i) => `
            <div class="stat-row">
              <span class="stat-label">${i} · ${levelNames[i]}</span>
              <span class="stat-value">${count} 个</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTrailStats(points) {
      const grid = $('#trailGrid');
      if (!points.length) {
        grid.innerHTML = '<div class="card"><div class="empty">暂无足迹轨迹数据</div></div>';
        return;
      }
      const totalDist = points.reduce((s, p, i) => {
        if (i === 0) return 0;
        const prev = points[i - 1];
        const R = 6371, dLat = (p.lat - prev.lat) * Math.PI / 180, dLon = (p.lon - prev.lon) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(prev.lat * Math.PI / 180) * Math.cos(p.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return s + 2 * R * Math.asin(Math.sqrt(a));
      }, 0);
      const days = Math.ceil((points[points.length - 1].time - points[0].time) / 86400);
      const avgSpeed = points.reduce((s, p) => s + p.speed, 0) / points.length;
      const startTime = new Date(points[0].time * 1000).toLocaleDateString('zh-CN');
      const endTime = new Date(points[points.length - 1].time * 1000).toLocaleDateString('zh-CN');

      grid.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-icon trail">👣</div>
            <div>
              <div class="card-title">足迹轨迹</div>
              <div class="card-subtitle">GPS 数据概览</div>
            </div>
          </div>
          <div class="stat-row"><span class="stat-label">轨迹点</span><span class="stat-value">${points.length.toLocaleString()} 个</span></div>
          <div class="stat-row"><span class="stat-label">总距离</span><span class="stat-value" style="color:var(--trail)">${totalDist.toFixed(0)} km</span></div>
          <div class="stat-row"><span class="stat-label">时间跨度</span><span class="stat-value" style="font-size:11px">${days} 天</span></div>
          <div class="stat-row"><span class="stat-label">平均速度</span><span class="stat-value">${avgSpeed.toFixed(2)} m/s</span></div>
          <div class="stat-row"><span class="stat-label">记录时间</span><span class="stat-value" style="font-size:11px">${startTime} ~ ${endTime}</span></div>
        </div>
      `;
    }

    function refresh() {
      renderTripStats(loadTripData());
      renderCityStats(loadCityData());
      renderTrailStats(loadTrailData());
    }

    refresh();
    $('#refreshBtn').onclick = refresh;
  })();
  </script>
</body>
</html>
