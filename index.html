<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Atlas</title>
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#07111f;color:#e0e6ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
        .logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#4dd7d0,#65a9ff);font-size:28px;margin-bottom:20px;box-shadow:0 8px 24px rgba(77,215,208,.25)}
        h1{font-size:22px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
        .sub{font-size:13px;color:#7a8ea1;margin-bottom:36px}
        .links{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
        .link-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#0f1a2a;border:1px solid rgba(148,184,218,.16);border-radius:14px;text-decoration:none;color:#e0e6ed;transition:.2s}
        .link-card:hover{background:#121f33;border-color:rgba(77,215,208,.35);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
        .link-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
        .link-icon.air{background:rgba(255,107,122,.15);color:#ff6b7a}
        .link-icon.city{background:rgba(91,120,245,.15);color:#5b78f5}
        .link-icon.rail{background:rgba(77,215,208,.15);color:#4dd7d0}
        .link-icon.road{background:rgba(255,198,109,.15);color:#ffc66d}
        .link-icon.full{background:rgba(139,163,255,.12);color:#8ba3ff}
        .link-text strong{display:block;font-size:14px;margin-bottom:2px}
        .link-text span{font-size:11px;color:#7a8ea1}
        .link-arrow{margin-left:auto;color:#4a5a6e;font-size:18px}
        .footer{margin-top:40px;font-size:11px;color:#4a5a6e;text-align:center;line-height:1.6}
        .footer a{color:#65a9ff;text-decoration:none}
    </style>
</head>
<body>
    <div class="logo">🧭</div>
    <h1>Travel Atlas</h1>
    <p class="sub">个人交通与城市探索可视化</p>

    <div class="links">
        <a class="link-card" href="TravelAtlas.html">
            <div class="link-icon air">✈️</div>
            <div class="link-text">
                <strong>快速添加行程</strong>
                <span>选择航线/铁路，实时绘制连线地图</span>
            </div>
            <div class="link-arrow">›</div>
        </a>

        <a class="link-card" href="TravelAtlasCity.html">
            <div class="link-icon city">🏙️</div>
            <div class="link-text">
                <strong>中国城市探索</strong>
                <span>标记到访城市，查看探索等级</span>
            </div>
            <div class="link-arrow">›</div>
        </a>

        <a class="link-card" href="map/map_line.html">
            <div class="link-icon full">🌍</div>
            <div class="link-text">
                <strong>球面交通地图</strong>
                <span>航空与铁路大圆航线总览</span>
            </div>
            <div class="link-arrow">›</div>
        </a>

        <a class="link-card" href="map/map_rail.html">
            <div class="link-icon rail">🚆</div>
            <div class="link-text">
                <strong>真实铁路轨迹</strong>
                <span>基于 OSM 的火车实际行驶路线</span>
            </div>
            <div class="link-arrow">›</div>
        </a>

        <a class="link-card" href="map/map_with_polyline_cityselect.html">
            <div class="link-icon road">🚴</div>
            <div class="link-text">
                <strong>公路轨迹地图</strong>
                <span>骑行与自驾路线记录</span>
            </div>
            <div class="link-arrow">›</div>
        </a>
    </div>

    <div class="footer">
        仅供个人学习与交流使用
    </div>
</body>
</html>
